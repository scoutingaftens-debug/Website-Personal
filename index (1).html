     const productListEl = document.getElementById('productList');
  const searchInput = document.getElementById('searchBarang');
  const addNewBtn = document.getElementById('addNewBtn');
  const totalSelectedEl = document.getElementById('totalSelected');
  let selectedProducts = {};

  function renderProducts(list) {
    productListEl.innerHTML = '';

    const combinedList = [
      ...new Set([...list, ...Object.keys(selectedProducts)])
    ];

    combinedList.forEach(product => {
      const li = document.createElement('li');
      li.className = 'product-item';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = 'cb_' + product.replace(/\s+/g, '_');
      checkbox.value = product;

      const isSelected = product in selectedProducts;
      checkbox.checked = isSelected;

      const qtyInput = document.createElement('input');
      qtyInput.type = 'number';
      qtyInput.min = 1;
      qtyInput.placeholder = 'Jumlah';
      qtyInput.disabled = !isSelected;

      if (isSelected) qtyInput.value = selectedProducts[product];

      checkbox.addEventListener('change', (e) => {
        if (e.target.checked) {
          selectedProducts[product] = 1;
          qtyInput.disabled = false;
          qtyInput.value = 1;
        } else {
          delete selectedProducts[product];
          qtyInput.disabled = true;
          qtyInput.value = '';
        }
        updateTotalSelected();
      });

      qtyInput.addEventListener('input', () => {
        if (qtyInput.value < 1 || qtyInput.value === '') {
          qtyInput.value = 1;
        }
        if (checkbox.checked) {
          selectedProducts[product] = qtyInput.value;
        }
        updateTotalSelected();
      });

      const label = document.createElement('label');
      label.htmlFor = checkbox.id;
      label.textContent = product;

      li.appendChild(checkbox);
      li.appendChild(label);
      li.appendChild(qtyInput);
      productListEl.appendChild(li);
    });

    updateTotalSelected();
  }

  function filterProducts() {
    const val = searchInput.value.toLowerCase().trim();
    if (val.length > 2) {
      const filtered = products.filter(p => p.toLowerCase().includes(val));
      const hasMatch = filtered.length > 0;
      addNewBtn.style.display = hasMatch ? 'none' : 'block';

      renderProducts(filtered);
    } else {
      addNewBtn.style.display = 'none';
      renderProducts(products);
      }
    }

    function showAddProduct() {
      const newProd = prompt('Masukkan nama barang baru:');
      if (newProd) {
        if (!products.includes(newProd)) {
          products.push(newProd);
          products.sort();
          renderProducts(products);
          searchInput.value = '';
          addNewBtn.style.display = 'none';
          alert('Barang baru berhasil ditambahkan.');
        } else {
          alert('Barang sudah ada dalam daftar.');
        }
      }
    }

    function updateTotalSelected() {
      const total = Object.keys(selectedProducts).length;
      totalSelectedEl.textContent = `Total Barang Dipilih: ${total}`;
    }

    function cekOrderan() {
      let message = 'Orderan:\n';
      let i = 1;
      for (const [prod, jumlah] of Object.entries(selectedProducts)) {
        message += `${i}. ${prod} : ${jumlah}\n`;
        i++;
      }
      if (i === 1) {
        alert('Belum ada barang yang dipilih.');
      } else {
        alert(message);
      }
    }

    function handleSubmit(e) {
      const namaToko = document.getElementById('namaToko').value;
      if (!namaToko) {
        alert('Silakan pilih nama toko terlebih dahulu!');
        e.preventDefault();
        return false;
      }
      if (Object.keys(selectedProducts).length === 0) {
        alert('Belum ada barang yang dipilih untuk diorder.');
        e.preventDefault();
        return false;
      }

      let orderText = '';
      let i = 1;
      for (const [prod, jumlah] of Object.entries(selectedProducts)) {
        orderText += `${i}. ${prod} : ${jumlah}\n`;
        i++;
      }

      const orderEntryName ='entry.1466775689'; // ganti dengan nama field yang sesuai
      let orderInput = document.querySelector(`input[name="${orderEntryName}"]`);

      if (!orderInput) {
        orderInput = document.createElement('input');
        orderInput.type = 'hidden';
        orderInput.name = orderEntryName;
        document.getElementById('orderForm').appendChild(orderInput);
      }
      orderInput.value = orderText;

      // Tampilkan overlay terima kasih
      const overlay = document.getElementById('thankYouOverlay');
      overlay.classList.add('show');

      // Submit form secara manual agar data terkirim ke iframe
      setTimeout(() => {
        e.target.submit();
      }, 10);

      // Setelah 3 detik reload halaman
      setTimeout(() => {
        location.reload();
      }, 3000);

      // Cegah submit default agar tidak reload cepat
      e.preventDefault();
      return false;
    }

    // Render awal
    renderProducts(products);
  </script>
